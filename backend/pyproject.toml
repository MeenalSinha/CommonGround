[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commonground-backend"
version = "0.1.0"
description = "CommonGround backend: secure Qloo integration and API for the mobile app"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.162,<1.0",
  "uvicorn[standard]>=0.54,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic>=2.14,<3.0",
  "pydantic-settings>=2.16,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.2,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.17,<1.0",
  "mypy>=2.4,<3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: calls the real Qloo API; skipped unless QLOO_API_KEY is set (run with: pytest -m live)",
]
addopts = "-ra -m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]
